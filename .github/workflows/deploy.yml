name: Deploy

# Continuous deployment to Cloudflare. Runs only when a CLOUDFLARE_API_TOKEN
# secret is present, so forks and un-configured repos skip it cleanly.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker + Pages
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The deployed Worker origin, e.g. https://general-mao-api.<sub>.workers.dev
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secret present
        id: guard
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "No CLOUDFLARE_API_TOKEN configured; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Deploy Worker (API + Durable Object)
        if: steps.guard.outputs.skip == 'false'
        run: npm run deploy --workspace=@mao/server

      - name: Build + deploy Pages (web)
        if: steps.guard.outputs.skip == 'false'
        run: npm run deploy --workspace=@mao/web
