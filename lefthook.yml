# Git hooks, configured locally. Not installed against any remote.
# Run `npx lefthook install` once to enable.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: npm run typecheck

pre-push:
  commands:
    test:
      run: npm run test
